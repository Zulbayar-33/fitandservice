<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Хоол бүртгэл</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      position: relative;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f4f6f9;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('bg.jpg') no-repeat center center;
      background-size: cover;
      filter: brightness(0.5);
      z-index: -1;
    }

    .box {
      max-width: 650px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .title {
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
    }

    #amountBox {
      display: none;
    }

    #msg {
      margin-top: 15px;
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .box {
        margin: 15px;
        padding: 20px;
      }

      .input-group {
        display: block;
      }

      .input-group input,
      .input-group button {
        width: 100%;
        border-radius: 8px !important;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="box">

    <h3 class="title">Хоол бүртгэл</h3>

    <label class="form-label">Ажилтан хайх</label>
    <div class="input-group mb-3">
      <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Нэр, код, овог хайх..."
      >
      <button class="btn btn-primary" onclick="filterEmployees()">
        Хайх
      </button>
    </div>

    <label class="form-label">Ажилтан сонгох</label>
    <select id="employee" class="form-select mb-3">
      <option value="">Уншиж байна...</option>
    </select>

    <label class="form-label">Огноо сонгох</label>
    <input
      type="date"
      id="date"
      class="form-control mb-3"
    >

    <label class="form-label">Хоолны төрөл</label>
    <select id="type" class="form-select mb-3" onchange="toggleAmount()">
      <option value="fit">Fit food</option>
      <option value="service">Service хоол</option>
      <option value="ahool">А хоол</option>
    </select>

    <div id="amountBox">
      <label class="form-label">Service хоолны дүн</label>
      <input
        type="number"
        id="amount"
        class="form-control mb-3"
        placeholder="Жишээ: 15000"
      >
    </div>

    <button class="btn btn-success w-100" onclick="saveFood()">
      Хадгалах
    </button>

    <div class="text-center mt-3">
      <a href="admin.html" class="btn btn-secondary w-100">
        Admin Panel
      </a>
    </div>

    <div id="msg"></div>

  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz4hVFjlVAh7X7SHLGRvy6Chq_LhQ4ODHfbwFtE0E7UquJ1WfACjynQ7ip-2ae19-XR6A/exec";

let employees = [];

async function loadData() {
  const empSelect = document.getElementById("employee");

  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    if (!data.success) {
      empSelect.innerHTML = `<option value="">${data.message || "Алдаа гарлаа"}</option>`;
      return;
    }

    employees = data.employees || [];

    renderEmployees(employees);

  } catch (error) {
    console.log(error);
    empSelect.innerHTML = `<option value="">Алдаа гарлаа</option>`;
  }
}

function renderEmployees(list) {
  const empSelect = document.getElementById("employee");

  empSelect.innerHTML = `<option value="">Ажилтан сонгоно уу</option>`;

  list.forEach(emp => {
    empSelect.innerHTML += `
      <option
        value="${emp.no}"
        data-no="${emp.no}"
        data-ovog="${emp.ovog}"
        data-ner="${emp.ner}"
        data-job="${emp.job}">
        ${emp.display}
      </option>
    `;
  });
}

function filterEmployees() {
  const keyword = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  if (!keyword) {
    renderEmployees(employees);
    return;
  }

  const filtered = employees.filter(emp => {
    const text = `${emp.no} ${emp.ovog} ${emp.ner} ${emp.job} ${emp.search} ${emp.display}`.toLowerCase();
    return text.includes(keyword);
  });

  renderEmployees(filtered);

  if (filtered.length === 1) {
    document.getElementById("employee").selectedIndex = 1;
  }
}

function toggleAmount() {
  const type = document.getElementById("type").value;

  document.getElementById("amountBox").style.display =
    type === "service" ? "block" : "none";
}

function getPickedDate() {
  const rawDate = document.getElementById("date").value;

  if (!rawDate) return "";

  const parts = rawDate.split("-");
  return Number(parts[1]) + "/" + Number(parts[2]);
}

async function saveFood() {
  const employee = document.getElementById("employee");
  const selected = employee.options[employee.selectedIndex];

  const date = getPickedDate();
  const type = document.getElementById("type").value;
  const amount = document.getElementById("amount").value;
  const msg = document.getElementById("msg");

  if (!selected || !selected.value) {
    msg.innerHTML = "<span class='text-danger'>Ажилтан сонгоно уу</span>";
    return;
  }

  if (!date) {
    msg.innerHTML = "<span class='text-danger'>Огноо сонгоно уу</span>";
    return;
  }

  if (type === "service" && !amount) {
    msg.innerHTML = "<span class='text-danger'>Service хоолны дүн оруулна уу</span>";
    return;
  }

  msg.innerHTML = "Хадгалж байна...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        type: type,
        date: date,
        amount: amount,
        no: selected.dataset.no,
        ovog: selected.dataset.ovog,
        ner: selected.dataset.ner,
        job: selected.dataset.job
      })
    });

    const data = await res.json();

    if (data.success) {
      msg.innerHTML = "<span class='text-success'>" + data.message + "</span>";
    } else {
      msg.innerHTML = "<span class='text-danger'>" + data.message + "</span>";
    }

  } catch (error) {
    console.log(error);
    msg.innerHTML = "<span class='text-danger'>Apps Script алдаа</span>";
  }
}

loadData();
</script>

</body>
</html>
