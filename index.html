<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Хоол бүртгэл</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
         
    body {
  position: relative;
  font-family: Arial, sans-serif;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: url('bg.jpg') no-repeat center center;
  background-size: cover;

  filter: brightness(0.5);
  z-index: -1;
}

    .box {
      max-width: 650px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .title {
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
    }

    #amountBox {
      display: none;
    }

    #msg {
      margin-top: 15px;
      text-align: center;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="box">

    <h3 class="title">Хоол бүртгэл</h3>

    <label class="form-label">Ажилтан сонгох</label>
    <select id="employee" class="form-select mb-3">
      <option value="">Уншиж байна...</option>
    </select>

    <label class="form-label">Огноо</label>
    <select id="date" class="form-select mb-3">
      <option value="">Уншиж байна...</option>
    </select>

    <label class="form-label">Хоолны төрө</label>
    <select id="type" class="form-select mb-3" onchange="toggleAmount()">
      <option value="fit">А хоол / Fit food</option>
      <option value="service">Service хоол</option>
    </select>

    <div id="amountBox">
      <label class="form-label">Service хоолны дүн</label>
      <input type="number" id="amount" class="form-control mb-3" placeholder="Жишээ: 15000">
    </div>

    <button class="btn btn-success w-100" onclick="saveFood()">
      Хадгалах
    </button>

    <div id="msg"></div>

  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzRZuLOGnuLV6jHC9fHhVlXqQi9yXRCiEabgGmM69ixZNLp1HrFQXa_h0agpsxRiaerLA/exec" 

let employees = [];

async function loadData() {
  const empSelect = document.getElementById("employee");
  const dateSelect = document.getElementById("date");

  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    employees = data.employees || [];

    empSelect.innerHTML = `<option value="">Ажилтан сонгоно уу</option>`;
    dateSelect.innerHTML = `<option value="">Огноо сонгоно уу</option>`;

    employees.forEach(emp => {
      empSelect.innerHTML += `
        <option 
          value="${emp.row}"
          data-no="${emp.no}"
          data-ovog="${emp.ovog}"
          data-ner="${emp.ner}"
          data-job="${emp.job}">
          ${emp.display}
        </option>
      `;
    });

    data.dates.forEach(date => {
      dateSelect.innerHTML += `
        <option value="${date}">${date}</option>
      `;
    });

  } catch (error) {
    empSelect.innerHTML = `<option>Алдаа гарлаа</option>`;
    dateSelect.innerHTML = `<option>Алдаа гарлаа</option>`;
  }
}

function toggleAmount() {
  const type = document.getElementById("type").value;
  document.getElementById("amountBox").style.display =
    type === "service" ? "block" : "none";
}

async function saveFood() {
  const employee = document.getElementById("employee");
  const selected = employee.options[employee.selectedIndex];

  const row = employee.value;
  const date = document.getElementById("date").value;
  const type = document.getElementById("type").value;
  const amount = document.getElementById("amount").value;
  const msg = document.getElementById("msg");

  if (!row) {
    msg.innerHTML = "<span class='text-danger'>Ажилтан сонгоно уу</span>";
    return;
  }

  if (!date) {
    msg.innerHTML = "<span class='text-danger'>Огноо сонгоно уу</span>";
    return;
  }

  if (type === "service" && !amount) {
    msg.innerHTML = "<span class='text-danger'>Service хоолны дүн оруулна уу</span>";
    return;
  }

  msg.innerHTML = "Хадгалж байна...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        row: row,
        date: date,
        type: type,
        amount: amount,
        no: selected.dataset.no,
        ovog: selected.dataset.ovog,
        ner: selected.dataset.ner,
        job: selected.dataset.job
      })
    });

    const data = await res.json();

    if (data.success) {
      msg.innerHTML = "<span class='text-success'>" + data.message + "</span>";
    } else {
      msg.innerHTML = "<span class='text-danger'>" + data.message + "</span>";
    }

  } catch (error) {
    console.log(error);
    msg.innerHTML = "<span class='text-danger'>Apps Script холболт алдаа</span>";
  }
}

loadData();
</script>

</body>
</html>
